<!DOCTYPE html>
<html xlmns:th="http://www.thymeleaf.org">
	<head th:replace="~{cabecalho :: cabecalho}">
	</head>
	<body>
		<section th:replace="~{menu :: topo}"></section>
		<form th:action="@{/login}" th:object="${administrador}" method="post" id="formulario">
			<h1>Login</h1>
			<label for="usuario">Usuário:</label><br>	
			<input type="text" th:field="*{usuario}" size="20" maxlength="20" required><br>
			<label for="senha">Senha</label><br>
			<input type="password" th:field="*{senha}" size="10" maxlength="10" required><br>
			<button type="submit">Logar</button>
		</form>
		<section th:if="${resposta!=null}">
		<div th:if="${resposta}">
			<h2>Login com sucesso!</h2>
		</div>
		<div th:unless="${resposta}"^>
			<h2>Login ou senha incorretos!</h2>
		</div>	
		</section>
	</body>
</html>
